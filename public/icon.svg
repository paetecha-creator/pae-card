<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <!-- Glowing back card -->
  <rect x="76" y="100" width="360" height="230" rx="24" fill="url(#bgGrad)" opacity="0.8" transform="rotate(-6 256 215)"/>
  <!-- Front card -->
  <rect x="76" y="140" width="360" height="230" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Card Chip -->
  <rect x="116" y="190" width="54" height="42" rx="8" fill="url(#goldChip)"/>
  <rect x="126" y="200" width="34" height="22" rx="4" fill="none" stroke="#78350f" stroke-width="2"/>
  <line x1="116" y1="211" x2="170" y2="211" stroke="#78350f" stroke-width="2"/>
  <!-- Contactless waves -->
  <path d="M195 198 A 14 14 0 0 1 195 224" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M205 192 A 22 22 0 0 1 205 230" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Card number dashes -->
  <text x="116" y="275" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="700" letter-spacing="4">••••  ••••  ••••  8899</text>
  <!-- Cardholder & Expiry -->
  <text x="116" y="325" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">PAE CARD WALLET</text>
  <!-- Small shield/fingerprint indicator -->
  <circle cx="380" cy="318" r="24" fill="#6366f1" opacity="0.3"/>
  <path d="M380 306 L392 312 V322 C392 329 386 335 380 337 C374 335 368 329 368 322 V312 Z" fill="#38bdf8"/>
  <path d="M376 322 L379 325 L385 318" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
